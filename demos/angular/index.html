<!doctype html><html lang="en" ng-app="touchlineApp"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Touchline AngularJS Demo</title>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
<style>body{font-family:Arial;background:#f7f5ff;color:#22213b;margin:0;padding:30px}.wrap{max-width:850px;margin:auto}.hero{background:#242044;color:white;border-radius:18px;padding:24px}.hero span{color:#ff8b8b}.toolbar{display:flex;gap:10px;margin:20px 0}input,select{padding:12px;border:1px solid #ddd8f4;border-radius:8px}.card{background:white;padding:16px;border-radius:12px;margin:10px 0}.pill{float:right;background:#e6fbf3;color:#008d6c;padding:5px 8px;border-radius:7px;font-size:12px}</style></head>
<body ng-controller="MatchController as vm"><div class="wrap"><div class="hero"><h1>⚽ Touchline <span>AngularJS demo</span></h1><p>Search and filter fixtures using AngularJS data binding.</p></div>
<div class="toolbar"><input ng-model="vm.search" placeholder="Search team name" aria-label="Search team"><select ng-model="vm.status" aria-label="Filter status"><option value="">All statuses</option><option>FT</option><option>UPCOMING</option></select></div>
<p>Showing {{ (vm.matches | filter:vm.search | filter:vm.status).length }} matches</p><article class="card" ng-repeat="m in vm.matches | filter:vm.search | filter:vm.status"><span class="pill">{{m.status}}</span><strong>{{m.home}} vs {{m.away}}</strong><p>Score: {{m.score}}</p></article></div>
<script>angular.module("touchlineApp",[]).controller("MatchController",function(){var vm=this;vm.search="";vm.status="";vm.matches=[{home:"Northbridge FC",away:"Coastal United",score:"2-1",status:"FT"},{home:"Metro Athletic",away:"Redwood Rovers",score:"1-1",status:"FT"},{home:"Summit City",away:"Valley Wanderers",score:"0-2",status:"FT"},{home:"Coastal United",away:"Metro Athletic",score:"TBD",status:"UPCOMING"}];});</script>
</body></html>
